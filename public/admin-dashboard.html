<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valore Admin Dashboard</title>
<style>
:root { --primary: #10b981; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { margin-bottom: 2rem; color: #059669; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
.card { background: var(--card); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
.stat-value { font-size: 2rem; font-weight: bold; color: var(--primary); }
.stat-label { color: #6b7280; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
th { color: #6b7280; font-weight: 600; font-size: 0.875rem; }
.badge { padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
.badge-success { background: #d1fae5; color: #065f46; }
.badge-pending { background: #fef3c7; color: #92400e; }
</style>
</head>
<body>
<div class="container">
<h1>Painel Administrativo Valore</h1>
<div id="stats-grid" class="grid"></div>
<div class="card">
<h2>Histórico de Auditoria</h2>
<table id="audit-table">
<thead>
<tr>
<th>Ação</th>
<th>Detalhes</th>
<th>Data</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>
<script>
const API_BASE = window.location.origin;
async function loadStats() {
try {
const res = await fetch(`${API_BASE}/api/gateway-stats`);
if (!res.ok) throw new Error('Não autorizado');
const stats = await res.json();
let totalRevenue = 0;
let totalOrders = 0;
let html = '';
for (const [gw, data] of Object.entries(stats)) {
totalRevenue += data.revenue;
totalOrders += data.count;
html += `
<div class="card">
<div class="stat-label">${gw.toUpperCase()}</div>
<div class="stat-value">R$ ${data.revenue.toFixed(2)}</div>
<div>${data.count} vendas • ${data.pending} pendentes</div>
</div>
`;
}
html += `
<div class="card" style="border: 2px solid var(--primary)">
<div class="stat-label">TOTAL GERAL</div>
<div class="stat-value">R$ ${totalRevenue.toFixed(2)}</div>
<div>${totalOrders} vendas confirmadas</div>
</div>
`;
document.getElementById('stats-grid').innerHTML = html;
} catch (err) {
document.getElementById('stats-grid').innerHTML = `<p style="color:red">Erro ao carregar estatísticas: ${err.message}</p>`;
}
}
async function loadAudit() {
// Nota: Endpoint de auditoria ainda precisa ser implementado no server.js se não estiver
// Por enquanto, deixamos a tabela vazia ou com mensagem
document.querySelector('#audit-table tbody').innerHTML = '<tr><td colspan="3">Carregando histórico...</td></tr>';
}
loadStats();
loadAudit();
</script>
</body>
</html>
