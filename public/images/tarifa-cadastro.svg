<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143621"/>
      <stop offset="50%" stop-color="#1b4d2e"/>
      <stop offset="100%" stop-color="#0d2617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.4"/>

  <!-- ID Badge Card -->
  <g filter="url(#glow)" transform="translate(30, 32)">
    <rect width="68" height="64" rx="10" fill="url(#cardGrad)"/>
    
    <!-- User Avatar Silhouette -->
    <circle cx="24" cy="26" r="10" fill="#0f172a"/>
    <path d="M14 48 C14 38 20 36 24 36 C28 36 34 38 34 48 Z" fill="#0f172a"/>

    <!-- Data lines -->
    <rect x="38" y="20" width="22" height="4" rx="2" fill="#94a3b8"/>
    <rect x="38" y="28" width="16" height="4" rx="2" fill="#94a3b8"/>
    <rect x="38" y="36" width="20" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Green Verified Badge -->
  <g transform="translate(76, 68)">
    <circle cx="16" cy="16" r="16" fill="url(#greenGrad)"/>
    <circle cx="16" cy="16" r="14" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M11 16 L14 19 L21 12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
