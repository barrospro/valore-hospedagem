<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#boltGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Speed Lines -->
  <line x1="30" y1="42" x2="42" y2="42" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="56" x2="38" y2="56" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="70" x2="44" y2="70" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Lightning Bolt -->
  <g filter="url(#glow)">
    <path d="M68 22 L44 64 L62 64 L54 104 L86 52 L68 52 Z" fill="url(#boltGrad)"/>
  </g>

  <!-- FAST PILL -->
  <g transform="translate(32, 92)">
    <rect width="64" height="20" rx="10" fill="#1e1b4b" stroke="url(#boltGrad)" stroke-width="1.5"/>
    <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1.2">EXPRESS</text>
  </g>
</svg>
