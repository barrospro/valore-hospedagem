<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#34d399" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Bar Charts -->
  <g filter="url(#glow)" transform="translate(26, 36)">
    <!-- Bar 1 -->
    <rect x="8" y="38" width="14" height="24" rx="4" fill="#065f46"/>
    <!-- Bar 2 -->
    <rect x="28" y="24" width="14" height="38" rx="4" fill="#047857"/>
    <!-- Bar 3 -->
    <rect x="48" y="10" width="14" height="52" rx="4" fill="url(#barGrad)"/>

    <!-- Ascending Trend Arrow -->
    <path d="M6 44 L26 28 L46 14 L68 2" fill="none" stroke="url(#arrowGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M54 2 L68 2 L68 16" fill="none" stroke="url(#arrowGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- + LIMITE Pill Badge -->
  <g transform="translate(32, 92)">
    <rect width="64" height="20" rx="10" fill="url(#arrowGrad)"/>
    <text x="32" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="1">+ LIMITE</text>
  </g>
</svg>
