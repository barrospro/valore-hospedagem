<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d2e"/>
      <stop offset="100%" stop-color="#0d2617"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Smartphone Frame -->
  <g filter="url(#glow)" transform="translate(40, 20)">
    <rect width="48" height="88" rx="14" fill="#ffffff"/>
    <rect x="2" y="2" width="44" height="84" rx="12" fill="#0f172a"/>
    <!-- Screen -->
    <rect x="4" y="8" width="40" height="72" rx="8" fill="url(#screenGrad)"/>
    <!-- Speaker notch -->
    <rect x="18" y="4" width="12" height="2" rx="1" fill="#64748b"/>
    <!-- Home indicator bar -->
    <rect x="16" y="75" width="16" height="2" rx="1" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Glowing Unlock Key / Checkmark on Screen -->
  <g transform="translate(52, 44)">
    <circle cx="12" cy="12" r="14" fill="url(#keyGrad)"/>
    <!-- Unlock Padlock Icon -->
    <path d="M12 7 C9.5 7 7.5 9 7.5 11.5 L7.5 14" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="6" y="12" width="12" height="9" rx="2.5" fill="#0f172a"/>
    <circle cx="12" cy="16.5" r="1.5" fill="#ffffff"/>
  </g>
</svg>
