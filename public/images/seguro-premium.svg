<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#eab308" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Shield Base -->
  <g filter="url(#glowGold)">
    <path d="M64 22 C78 22 92 27 92 38 C92 68 76 88 64 98 C52 88 36 68 36 38 C36 27 50 22 64 22 Z" 
          fill="url(#goldGrad)"/>
    <path d="M64 26 C75 26 87 30 87 40 C87 66 73 83 64 92 C55 83 41 66 41 40 C41 30 53 26 64 26 Z" 
          fill="#1c1917" opacity="0.8"/>
  </g>

  <!-- Crown Icon inside -->
  <path d="M48 64 L44 48 L56 56 L64 42 L72 56 L84 48 L80 64 Z" fill="url(#goldGrad)"/>
  <circle cx="44" cy="46" r="2.5" fill="#ffffff"/>
  <circle cx="64" cy="40" r="3" fill="#ffffff"/>
  <circle cx="84" cy="46" r="2.5" fill="#ffffff"/>

  <!-- PREMIUM Pill Badge -->
  <g transform="translate(32, 86)">
    <rect width="64" height="20" rx="10" fill="url(#goldGrad)"/>
    <text x="32" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" font-weight="900" fill="#0c0a09" text-anchor="middle" letter-spacing="1.2">PREMIUM</text>
  </g>
</svg>
