<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#34d399" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Banknote Stack -->
  <g filter="url(#glow)" transform="translate(30, 32)">
    <!-- Bottom Note -->
    <rect x="0" y="24" width="68" height="38" rx="6" fill="#065f46" transform="rotate(-6 34 43)"/>
    <!-- Middle Note -->
    <rect x="0" y="24" width="68" height="38" rx="6" fill="#047857" transform="rotate(4 34 43)"/>
    <!-- Top Note -->
    <rect x="0" y="24" width="68" height="38" rx="6" fill="url(#billGrad)"/>
    <circle cx="34" cy="43" r="10" fill="#064e3b" opacity="0.3"/>
    <text x="34" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" font-weight="900" fill="#064e3b" text-anchor="middle">$</text>
  </g>

  <!-- Sparkles -->
  <path d="M96 24 L98 29 L103 31 L98 33 L96 38 L94 33 L89 31 L94 29 Z" fill="url(#goldGrad)"/>

  <!-- +R$ 5.000 Pill Badge -->
  <g transform="translate(24, 92)">
    <rect width="80" height="22" rx="11" fill="url(#goldGrad)"/>
    <text x="40" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="0.5">+ R$ 5.000</text>
  </g>
</svg>
