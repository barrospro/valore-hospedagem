<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="50%" stop-color="#144d2d"/>
      <stop offset="100%" stop-color="#081c13"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Shield Base -->
  <g filter="url(#glow)">
    <path d="M64 24 C78 24 92 29 92 40 C92 70 76 90 64 100 C52 90 36 70 36 40 C36 29 50 24 64 24 Z" 
          fill="url(#shieldGrad)"/>
    <path d="M64 28 C75 28 87 32 87 42 C87 68 73 85 64 94 C55 85 41 68 41 42 C41 32 53 28 64 28 Z" 
          fill="#064e3b" opacity="0.6"/>
  </g>

  <!-- Padlock in Center -->
  <g transform="translate(50, 48)">
    <!-- Shackle -->
    <path d="M14 6 C10 6 7 9 7 14 L7 18 L21 18 L21 14 C21 9 18 6 14 6 Z" 
          fill="none" stroke="url(#lockGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Body -->
    <rect y="16" width="28" height="22" rx="6" fill="url(#lockGrad)"/>
    <!-- Keyhole -->
    <circle cx="14" cy="25" r="2.5" fill="#081c13"/>
    <path d="M14 25 L14 31" stroke="#081c13" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
