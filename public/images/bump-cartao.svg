<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#chipGrad)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Credit Card Object -->
  <g filter="url(#glow)" transform="translate(24, 38)">
    <rect width="80" height="52" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- EMV Chip -->
    <rect x="10" y="14" width="16" height="12" rx="3" fill="url(#chipGrad)"/>
    
    <!-- Contactless Waves -->
    <path d="M34 16 A 6 6 0 0 1 34 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M37 14 A 9 9 0 0 1 37 26" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Valore Brand on Card -->
    <text x="68" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="8" font-weight="900" fill="url(#chipGrad)" text-anchor="end" letter-spacing="1">VALORE</text>

    <!-- Card Numbers Preview -->
    <circle cx="14" cy="38" r="1.5" fill="#64748b"/>
    <circle cx="19" cy="38" r="1.5" fill="#64748b"/>
    <circle cx="24" cy="38" r="1.5" fill="#64748b"/>
    <circle cx="29" cy="38" r="1.5" fill="#64748b"/>
    <text x="68" y="41" font-family="monospace" font-size="7" font-weight="700" fill="#cbd5e1" text-anchor="end">4812</text>
  </g>
</svg>
