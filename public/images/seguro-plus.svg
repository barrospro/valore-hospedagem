<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143621"/>
      <stop offset="50%" stop-color="#1b4d2e"/>
      <stop offset="100%" stop-color="#0d2617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Shield Base -->
  <g filter="url(#glow)">
    <path d="M64 22 C78 22 92 27 92 38 C92 68 76 88 64 98 C52 88 36 68 36 38 C36 27 50 22 64 22 Z" 
          fill="url(#shieldGrad)"/>
    <path d="M64 26 C75 26 87 30 87 40 C87 66 73 83 64 92 C55 83 41 66 41 40 C41 30 53 26 64 26 Z" 
          fill="#064e3b" opacity="0.6"/>
  </g>

  <!-- Star / Sparkle in Top Right -->
  <path d="M88 22 L90 28 L96 30 L90 32 L88 38 L86 32 L80 30 L86 28 Z" fill="url(#goldGrad)"/>

  <!-- Checkmark + Plus Badge -->
  <path d="M52 56 L60 64 L76 46" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PLUS Pill Badge -->
  <g transform="translate(42, 86)">
    <rect width="44" height="20" rx="10" fill="url(#goldGrad)"/>
    <text x="22" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" font-weight="900" fill="#0f291e" text-anchor="middle" letter-spacing="1">PLUS</text>
  </g>
</svg>
