<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Document Sheet -->
  <g transform="translate(36, 26)">
    <rect width="56" height="74" rx="8" fill="url(#docGrad)"/>
    <!-- Folded Corner -->
    <path d="M42 0 L56 14 L42 14 Z" fill="#cbd5e1"/>
    <!-- Document Lines -->
    <rect x="10" y="22" width="36" height="4" rx="2" fill="#94a3b8"/>
    <rect x="10" y="32" width="28" height="4" rx="2" fill="#94a3b8"/>
    <rect x="10" y="42" width="32" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Official Federal Seal / Stamp -->
  <g filter="url(#glow)" transform="translate(68, 68)">
    <circle cx="18" cy="18" r="18" fill="url(#goldGrad)"/>
    <circle cx="18" cy="18" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">IOF</text>
  </g>
</svg>
