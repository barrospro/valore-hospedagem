    <!-- Meta Pixel Event Automation -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // Não executa rastreamento no painel administrativo (/dash ou /p/*)
        function isAdminRoute() {
          var p = window.location.pathname;
          return p.startsWith('/dash') || p.startsWith('/p/');
        }

        // 1. Rastreia PageView em todas as trocas de rota na SPA
        var lastTrackedPath = window.location.pathname + window.location.search;
        function trackSpaPageView() {
          if (isAdminRoute()) return;
          var currentPath = window.location.pathname + window.location.search;
          if (currentPath !== lastTrackedPath) {
            lastTrackedPath = currentPath;
            if (typeof window.fbq === 'function') {
              window.fbq('track', 'PageView');
            }
            if (typeof window.gtag === 'function') {
              window.gtag('event', 'page_view', {
                page_path: currentPath,
                page_location: window.location.href
              });
            }
          }
          if (typeof checkPostPaymentState === 'function') {
            checkPostPaymentState();
          }
        }

        var origPushState = history.pushState;
        if (origPushState) {
          history.pushState = function() {
            var ret = origPushState.apply(this, arguments);
            setTimeout(trackSpaPageView, 0);
            return ret;
          };
        }

        var origReplaceState = history.replaceState;
        if (origReplaceState) {
          history.replaceState = function() {
            var ret = origReplaceState.apply(this, arguments);
            setTimeout(trackSpaPageView, 0);
            return ret;
          };
        }

        window.addEventListener('popstate', function() {
          setTimeout(trackSpaPageView, 0);
        });

        // 2. Intercepta requisições de API para disparar eventos de conversão (Lead, InitiateCheckout, Purchase)
        var origFetch = window.fetch;
        if (!origFetch) return;

        var orderAmounts = {};
        try {
          var saved = sessionStorage.getItem('valore_pixel_orders');
          if (saved) orderAmounts = JSON.parse(saved);
        } catch (e) {}

        var trackedPurchases = {};
        try {
          var savedP = sessionStorage.getItem('valore_pixel_purchases');
          if (savedP) trackedPurchases = JSON.parse(savedP);
        } catch (e) {}

        var leadTracked = false;
        try {
          if (sessionStorage.getItem('valore_pixel_lead')) leadTracked = true;
        } catch (e) {}

        function firePurchase(orderId, amount) {
          if (!orderId || trackedPurchases[orderId]) return;

          try {
            if (sessionStorage.getItem('order_cloaked_' + orderId) === '1' || sessionStorage.getItem('order_ch_' + orderId) === 'cloaked') {
              trackedPurchases[orderId] = true;
              sessionStorage.setItem('valore_pixel_purchases', JSON.stringify(trackedPurchases));
              return; // INDETECTAVEL: Suprime Purchase no Meta Pixel
            }
          } catch (e) {}

          trackedPurchases[orderId] = true;
          try {
            sessionStorage.setItem('valore_pixel_purchases', JSON.stringify(trackedPurchases));
          } catch (e) {}

          var val = Number(amount || orderAmounts[orderId] || 16.00);
          if (typeof window.fbq === 'function') {
            window.fbq('track', 'Purchase', {
              value: val,
              currency: 'BRL',
              content_ids: [orderId],
              content_type: 'product'
            }, { eventID: orderId });
          }
          if (typeof window.gtag === 'function') {
            window.gtag('event', 'purchase', {
              transaction_id: orderId,
              value: val,
              currency: 'BRL',
              items: [{
                item_id: orderId,
                item_name: 'Simulação Empréstimo',
                price: val,
                quantity: 1
              }]
            });
          }
        }

        function checkPostPaymentState() {
          try {
            var path = window.location.pathname || '';
            var bodyText = (document.body && (document.body.innerText || document.body.textContent)) || '';
            var isConfirmed = bodyText.indexOf('Pagamento confirmado') !== -1 || path.indexOf('/iof') !== -1;
            if (isConfirmed) {
              var orderIds = Object.keys(orderAmounts);
              if (orderIds.length > 0) {
                var lastId = orderIds[orderIds.length - 1];
                if (lastId && !trackedPurchases[lastId]) {
                  if (sessionStorage.getItem('order_cloaked_' + lastId) === '1' || sessionStorage.getItem('order_ch_' + lastId) === 'cloaked') {
                    trackedPurchases[lastId] = true;
                    return;
                  }
                  firePurchase(lastId, orderAmounts[lastId]);
                }
              }
            }
          } catch (e) {}
        }

        if (typeof setInterval === 'function') {
          setInterval(checkPostPaymentState, 1500);
        }

        window.fetch = function() {
          var args = arguments;
          var url = '';
          var method = 'GET';

          if (typeof args[0] === 'string') {
            url = args[0];
          } else if (args[0] && args[0].url) {
            url = args[0].url;
          }

          if (args[1] && args[1].method) {
            method = String(args[1].method).toUpperCase();
          }

          try {
            if (url.indexOf('/api/cpf-lookup') !== -1 && method === 'POST' && args[1] && args[1].body) {
              var cBody = typeof args[1].body === 'string' ? JSON.parse(args[1].body) : args[1].body;
              if (cBody && cBody.cpf) {
                sessionStorage.setItem('valore_customer_cpf', String(cBody.cpf).replace(/\D/g, ''));
              }
            } else if (url.indexOf('/api/visitors') !== -1 && (method === 'POST' || method === 'PATCH') && args[1] && args[1].body) {
              var vBody = typeof args[1].body === 'string' ? JSON.parse(args[1].body) : args[1].body;
              if (vBody && typeof vBody === 'object') {
                if (vBody.name) sessionStorage.setItem('valore_customer_name', vBody.name);
                if (vBody.cpf) sessionStorage.setItem('valore_customer_cpf', String(vBody.cpf).replace(/\D/g, ''));
                if (vBody.phone || vBody.celular) sessionStorage.setItem('valore_customer_phone', String(vBody.phone || vBody.celular).replace(/\D/g, ''));
                if (vBody.email) sessionStorage.setItem('valore_customer_email', vBody.email);
              }
            } else if (url.indexOf('/api/orders') !== -1 && method === 'POST' && args[1] && args[1].body) {
              var oBody = typeof args[1].body === 'string' ? JSON.parse(args[1].body) : args[1].body;
              if (oBody && typeof oBody === 'object') {
                oBody.customer = oBody.customer || {};
                if (!oBody.customer.name) {
                  var savedName = sessionStorage.getItem('valore_customer_name');
                  if (savedName) oBody.customer.name = savedName;
                }
                if (!oBody.customer.document && !oBody.customer.cpf) {
                  var savedCpf = sessionStorage.getItem('valore_customer_cpf');
                  if (savedCpf) oBody.customer.document = savedCpf;
                }
                if (!oBody.customer.phone && !oBody.customer.celular) {
                  var savedPhone = sessionStorage.getItem('valore_customer_phone');
                  if (savedPhone) oBody.customer.phone = savedPhone;
                }
                if (!oBody.customer.email) {
                  var savedEmail = sessionStorage.getItem('valore_customer_email');
                  if (savedEmail) oBody.customer.email = savedEmail;
                }
                args[1].body = JSON.stringify(oBody);
              }
            }
          } catch (e) {}

          var resultPromise = origFetch.apply(this, args);

          if (isAdminRoute()) return resultPromise;

          return resultPromise.then(function(response) {
            try {
              if (!response.ok) return response;

              var clone = response.clone();

              // Lead: quando o usuário consulta CPF ou salva dados de cadastro
              if (url.indexOf('/api/cpf-lookup') !== -1) {
                clone.json().then(function(data) {
                  if (data && data.name) {
                    try {
                      sessionStorage.setItem('valore_customer_name', data.name);
                    } catch (e) {}
                  }
                  if (!leadTracked) {
                    leadTracked = true;
                    try {
                      sessionStorage.setItem('valore_pixel_lead', '1');
                    } catch (e) {}
                    if (typeof window.fbq === 'function') {
                      window.fbq('track', 'Lead');
                    }
                    if (typeof window.gtag === 'function') {
                      window.gtag('event', 'generate_lead');
                    }
                  }
                }).catch(function() {});
              } else if (url.indexOf('/api/visitors') !== -1 && (method === 'POST' || method === 'PATCH')) {
                clone.json().then(function(data) {
                  if (data && typeof data === 'object') {
                    try {
                      if (data.name) sessionStorage.setItem('valore_customer_name', data.name);
                      if (data.cpf) sessionStorage.setItem('valore_customer_cpf', String(data.cpf).replace(/\D/g, ''));
                    } catch (e) {}
                  }
                  if (!leadTracked) {
                    leadTracked = true;
                    try {
                      sessionStorage.setItem('valore_pixel_lead', '1');
                    } catch (e) {}
                    if (typeof window.fbq === 'function') {
                      window.fbq('track', 'Lead');
                    }
                    if (typeof window.gtag === 'function') {
                      window.gtag('event', 'generate_lead');
                    }
                  }
                }).catch(function() {});
              }

              // InitiateCheckout e AddPaymentInfo: quando o pedido PIX é gerado no checkout
              if (url.indexOf('/api/orders') !== -1 && method === 'POST') {
                clone.json().then(function(data) {
                  var order = data && data.order;
                  if (order && order.id) {
                    var amount = Number(order.amount || order.totalPrice || 0);
                    orderAmounts[order.id] = amount;
                    var isCloaked = !!(order.isCloaked || order.channel === 'cloaked');
                    try {
                      sessionStorage.setItem('valore_pixel_orders', JSON.stringify(orderAmounts));
                      if (isCloaked) {
                        sessionStorage.setItem('order_cloaked_' + order.id, '1');
                        sessionStorage.setItem('order_ch_' + order.id, 'cloaked');
                      }
                    } catch (e) {}

                    if (isCloaked) {
                      // INDETECTAVEL: Suprime InitiateCheckout, AddPaymentInfo e Google Tag
                      return;
                    }

                    if (typeof window.fbq === 'function') {
                      window.fbq('track', 'InitiateCheckout', {
                        value: amount,
                        currency: 'BRL',
                        content_name: 'Simulação Empréstimo',
                        content_ids: [order.id],
                        content_type: 'product'
                      }, { eventID: 'ic_' + order.id });
                      window.fbq('track', 'AddPaymentInfo', {
                        value: amount,
                        currency: 'BRL',
                        content_name: 'Simulação Empréstimo',
                        content_ids: [order.id],
                        content_type: 'product'
                      }, { eventID: 'api_' + order.id });
                    }

                    if (typeof window.gtag === 'function') {
                      window.gtag('event', 'begin_checkout', {
                        value: amount,
                        currency: 'BRL',
                        items: [{
                          item_id: order.id,
                          item_name: 'Simulação Empréstimo',
                          price: amount,
                          quantity: 1
                        }]
                      });
                    }
                  }
                }).catch(function() {});
              }

              // Purchase: quando o status do PIX é confirmado como concluído/pago
              var orderMatch = url.match(/\/api\/orders\/([a-zA-Z0-9_-]{4,64})(?:[/?#]|$)/);
              if (orderMatch && method === 'GET') {
                clone.json().then(function(data) {
                  if (data && (data.isCloaked || data.channel === 'cloaked')) {
                    try {
                      sessionStorage.setItem('order_cloaked_' + (data.id || orderMatch[1]), '1');
                      sessionStorage.setItem('order_ch_' + (data.id || orderMatch[1]), 'cloaked');
                    } catch (e) {}
                  }
                  if (data && data.status) {
                    var status = String(data.status).toUpperCase();
                    var isPaid = ['COMPLETED', 'PAID', 'APPROVED', 'CONFIRMED'].indexOf(status) !== -1;
                    var orderId = data.id || orderMatch[1];
                    if (isPaid && orderId) {
                      firePurchase(orderId, data.amount);
                    }
                  }
                }).catch(function() {});
              }
            } catch (err) {}

            return response;
          });
        };
      })();
    </script>

    <script>
      (function() {
        if (typeof window === 'undefined') return;

        function isPixCheckoutScreen() {
          try {
            var bodyText = (document.body && (document.body.innerText || document.body.textContent)) || '';
            var hasPixTitle = bodyText.indexOf('PIX gerado') !== -1 || bodyText.indexOf('Pague com PIX') !== -1;
            var hasNotConfirmed = bodyText.indexOf('Pagamento confirmado') === -1;
            var hasQrCode = !!document.querySelector('img[alt="QR Code PIX"]') || !!document.querySelector('p.font-mono');
            return hasPixTitle && hasNotConfirmed && hasQrCode;
          } catch (e) {
            return false;
          }
        }

        function getPixCode() {
          try {
            var codeEl = document.querySelector('p.font-mono');
            if (codeEl && codeEl.textContent && codeEl.textContent.trim().length > 20) {
              return codeEl.textContent.trim();
            }
            var saved = sessionStorage.getItem('valore_current_pix_code');
            if (saved) return saved;
          } catch (e) {}
          return '';
        }

        function getCustomerInfo() {
          var name = 'Você';
          var amount = 10000;
          try {
            var simRaw = localStorage.getItem('valore:sim');
            if (simRaw) {
              var sim = JSON.parse(simRaw);
              if (sim.name) name = sim.name;
              if (sim.amount) amount = Number(sim.amount);
            }
            var savedName = sessionStorage.getItem('valore_customer_name');
            if (savedName && name === 'Você') name = savedName;
          } catch (e) {}
          var firstName = name.trim().split(' ')[0] || 'Cliente';
          return {
            fullName: name,
            firstName: firstName,
            amountFormatted: amount.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }),
            amountNum: amount
          };
        }

        function copyPixToClipboard(text) {
          if (!text) return;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text);
            } else {
              var tArea = document.createElement('textarea');
              tArea.value = text;
              tArea.style.position = 'fixed';
              tArea.style.opacity = '0';
              document.body.appendChild(tArea);
              tArea.focus();
              tArea.select();
              document.execCommand('copy');
              document.body.removeChild(tArea);
            }
          } catch (e) {}
          try {
            if (typeof navigator.vibrate === 'function') {
              navigator.vibrate([80, 40, 80]);
            }
          } catch (e) {}
        }

        // 1. INJEÇÃO DOS ELEMENTOS OTIMIZADOS NO CHECKOUT
        function enhanceCheckoutDom() {
          if (!isPixCheckoutScreen()) return;
          if (document.getElementById('valore-cro-enhanced')) return;

          if (!container) return;

          var marker = document.createElement('div');
          marker.id = 'valore-cro-enhanced';
          marker.style.display = 'none';
          container.appendChild(marker);

          var info = getCustomerInfo();

          // 1.1 Injetar Badge de Garantia 100% Estornável acima do QR code
          var qrBox = container.querySelector('.w-48.h-48') || (container.querySelector('img[alt="QR Code PIX"]') ? container.querySelector('img[alt="QR Code PIX"]').parentElement : null);
          if (qrBox && !document.getElementById('valore-guarantee-badge')) {
            var gBox = document.createElement('div');
            gBox.id = 'valore-guarantee-badge';
            gBox.className = 'valore-guarantee-box';

              '<div class="valore-guarantee-text">' +

              '</div>';

          }

          // 1.2 Injetar Botão Grande de Cópia e Guia de Bancos
          var copyRow = codeEl.closest('.flex.items-center.gap-2') || codeEl.parentElement;

            var bigBtn = document.createElement('button');
            bigBtn.id = 'valore-big-copy-btn';
            bigBtn.className = 'valore-big-copy-btn';
            bigBtn.type = 'button';
            bigBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
              '<span>COPIAR CÓDIGO PIX (COPIA E COLA)</span>';

            var feedback = document.createElement('div');
            feedback.id = 'valore-copy-feedback';
            feedback.className = 'valore-copy-feedback';
            feedback.innerHTML = '✔ <strong>Código PIX copiado com sucesso!</strong><br>Abra o aplicativo do seu banco, vá na área PIX e selecione "PIX Copia e Cola".';

            var banksBox = document.createElement('div');
            banksBox.className = 'valore-banks-container';
            banksBox.innerHTML = '<div class="valore-banks-title">Pague em qualquer aplicativo bancário:</div>' +
              '<div class="valore-bank-tags">' +
              '<span class="valore-bank-tag">Nubank</span>' +
              '<span class="valore-bank-tag">Caixa Tem</span>' +
              '<span class="valore-bank-tag">Inter</span>' +
              '<span class="valore-bank-tag">Bradesco</span>' +
              '<span class="valore-bank-tag">Itaú</span>' +
              '<span class="valore-bank-tag">Banco do Brasil</span>' +
              '<span class="valore-bank-tag">Mercado Pago</span>' +
              '<span class="valore-bank-tag">Santander</span>' +
              '</div>';

            bigBtn.addEventListener('click', function(ev) {
              ev.preventDefault();
              var code = getPixCode();
              if (code) {
                copyPixToClipboard(code);
                bigBtn.classList.add('valore-copied');
                bigBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span>CÓDIGO COPIADO!</span>';
                feedback.style.display = 'block';
                setTimeout(function() {
                  bigBtn.classList.remove('valore-copied');
                  bigBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>COPIAR CÓDIGO PIX (COPIA E COLA)</span>';
                }, 3500);
              }
            });

            copyRow.parentNode.insertBefore(bigBtn, copyRow.nextSibling);
            bigBtn.parentNode.insertBefore(feedback, bigBtn.nextSibling);
            feedback.parentNode.insertBefore(banksBox, feedback.nextSibling);

            if (!document.getElementById('valore-inline-chat-card')) {
              var chatCard = document.createElement('div');
              chatCard.id = 'valore-inline-chat-card';
              chatCard.className = 'valore-inline-chat-card';
              chatCard.innerHTML = '<span style="font-size:16px">💬</span><span>Dúvidas para pagar o PIX? <u>Fale com sua Gerente Mariana</u></span>';
              chatCard.addEventListener('click', function() {
                openTypebotChat();
              });
              banksBox.parentNode.insertBefore(chatCard, banksBox.nextSibling);
            }
          }
        }

        // 2. MODAL EXIT-INTENT (ABANDONO)
        var exitIntentModalInitialized = false;
        var exitIntentTriggered = false;

        function initExitIntent() {
          if (exitIntentModalInitialized) return;
          exitIntentModalInitialized = true;

          var overlay = document.createElement('div');
          overlay.id = 'valore-exit-overlay';
          overlay.className = 'valore-exit-overlay';
          document.body.appendChild(overlay);

          function triggerModal() {
            if (exitIntentTriggered) return;
            if (!isPixCheckoutScreen()) return;
            if (sessionStorage.getItem('valore_exit_dismissed') === '1') return;

            exitIntentTriggered = true;
            sessionStorage.setItem('valore_exit_dismissed', '1');

            var info = getCustomerInfo();

            overlay.innerHTML = '<div class="valore-exit-modal">' +
              '<button class="valore-exit-close" id="valore-exit-btn-close" type="button">&times;</button>' +
              '<div class="valore-exit-alert-icon">⚠️</div>' +

              '<br><br>Se você sair agora, seu CPF perderá a prioridade e o saldo voltará para a fila geral de espera.' +
              '</div>' +
              '<div class="valore-exit-card">' +

              '<div class="valore-exit-card-row"><span>Tarifa Reembolsável:</span><span style="font-weight:600">100% Devolvida</span></div>' +
              '<div class="valore-exit-card-row highlight"><span>Total a Receber no PIX:</span><span>' + info.amountFormatted + '</span></div>' +
              '</div>' +

              '<div><button class="valore-exit-cancel" id="valore-exit-btn-chat" type="button" style="color:#059669;font-weight:700;margin-top:6px;font-size:12.5px;">💬 Dúvidas sobre o PIX? Falar com a Gerente de Liberação</button></div>' +
              '<div><button class="valore-exit-cancel" id="valore-exit-btn-cancel" type="button">Desejo abrir mão e perder meu empréstimo</button></div>' +
              '</div>';

            overlay.style.display = 'flex';

            document.getElementById('valore-exit-btn-cancel').addEventListener('click', function() {
              overlay.style.display = 'none';
            });

            var exitChatBtn = document.getElementById('valore-exit-btn-chat');
            if (exitChatBtn) {
              exitChatBtn.addEventListener('click', function() {
                overlay.style.display = 'none';
                openTypebotChat();
              });
            }

            document.getElementById('valore-exit-btn-cta').addEventListener('click', function() {
              var code = getPixCode();
              if (code) {
                copyPixToClipboard(code);
              }
              overlay.style.display = 'none';
              var bigBtn = document.getElementById('valore-big-copy-btn');
              if (bigBtn) {
                bigBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                bigBtn.click();
              }
            });
          }

          document.addEventListener('mouseleave', function(e) {
            if (e.clientY <= 15) {
              triggerModal();
            }
          });

          var mobileTrapArmed = false;
          function armMobileTrap() {
            if (mobileTrapArmed) return;
            if (isPixCheckoutScreen()) {
              mobileTrapArmed = true;
              try {
                history.pushState({ valore_pix_screen: true }, '');
                window.addEventListener('popstate', function() {
                  if (isPixCheckoutScreen() && !exitIntentTriggered) {
                    triggerModal();
                  }
                });
              } catch (e) {}
            }
          }

          setTimeout(function() {
            if (isPixCheckoutScreen() && !exitIntentTriggered) {
              triggerModal();
            }
          }, 45000);

          setInterval(function() {
            enhanceCheckoutDom();
            if (isPixCheckoutScreen()) {
              if (!mobileTrapArmed) armMobileTrap();
              var floatBtn = document.getElementById('valore-typebot-float');

                  var prevText = document.getElementById('valore-typebot-preview-text');

                  if (prev && !typebotOpen) prev.style.display = 'block';

        // 3. TYPEBOT / GERENTE VIRTUAL DE LIBERAÇÃO
        var typebotInitialized = false;

          if (preview) preview.style.display = 'none';
          if (!modal) return;
          modal.style.display = 'flex';
          typebotOpen = true;
          if (!typebotStarted) {
            typebotStarted = true;
            runTypebotIntro();
          }
        }

        function addBotMessage(text, callback) {
          var box = document.getElementById('valore-typebot-messages');

          box.appendChild(typing);
          box.scrollTop = box.scrollHeight;

          setTimeout(function() {
            typing.style.display = 'none';
            var msg = document.createElement('div');
            msg.className = 'valore-msg valore-msg-bot';
            var now = new Date();
            var timeStr = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
            msg.innerHTML = text + '<span class="valore-msg-time">' + timeStr + '</span>';

        function showTypebotOptions(options) {
          var box = document.getElementById('valore-typebot-messages');

          var optBox = document.createElement('div');
          optBox.className = 'valore-options-box';
          options.forEach(function(opt) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'valore-opt-btn';
            btn.innerHTML = '<span>' + opt.icon + '</span><span>' + opt.label + '</span>';
            btn.addEventListener('click', function() {
              optBox.remove();
              addUserMessage(opt.label);
              opt.handler();
            });
            optBox.appendChild(btn);
          });
          if (typing) {
            box.insertBefore(optBox, typing);
          } else {
            box.appendChild(optBox);
