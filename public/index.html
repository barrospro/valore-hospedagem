              indexable: item.indexable,
              canonical: item.indexable ? ("https://www.valorebrasil.app" + (path === "/" ? "/" : path)) : null

            setOrUpdateMeta('meta[name="twitter:description"]', "name", "twitter:description", meta.description);

            // Canonical: Mantém apenas para rotas indexáveis, sem conflito em rotas privadas

              }
              setOrUpdateMeta('meta[property="og:url"]', "property", "og:url", "https://www.valorebrasil.app" + meta.path);

    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // Não executa rastreamento no painel administrativo (/dash ou /p/*)
        function isAdminRoute() {
          var p = window.location.pathname;
          return p.startsWith('/dash') || p.startsWith('/p/');
        }

        // Captura client_id e session_id reais dos cookies oficiais do Google Analytics
        function getGaCookieClientId() {
          try {
            var match = document.cookie.match(/(?:^|;\s*)_ga=GA1\.[0-9]+\.([0-9]+\.[0-9]+)/);
            if (match) return match[1];
          } catch (e) {}
          return undefined;
        }

        function getGaCookieSessionId() {
          try {
            var match = document.cookie.match(/(?:^|;\s*)_ga_3NGR6D3GKF=GS[0-9]+\.[0-9]+\.([0-9]+)/);
            if (match) return match[1];
          } catch (e) {}
          return undefined;
        }

        // 1. Rastreia PageView em todas as trocas de rota na SPA e na carga inicial
        var lastTrackedPath = null;
        function trackSpaPageView() {
          if (isAdminRoute()) return;
          var currentPath = window.location.pathname + window.location.search;
                    if (currentPath !== lastTrackedPath) {
            lastTrackedPath = currentPath;
            var currentMeta = typeof window.updateValoreSeo === 'function' ? window.updateValoreSeo(window.location.pathname) : null;
            if (typeof window.fbq === 'function') {
              window.fbq('track', 'PageView');
            }
            if (typeof window.gtag === 'function') {
              window.gtag('event', 'page_view', {
                page_path: currentPath,
                page_location: window.location.href,
                page_title: (currentMeta && currentMeta.title) || document.title || 'Valore Brasil'
              });
            }

            // qualify_lead: disparado exclusivamente quando o crédito é realmente qualificado/aprovado pelo sistema
            if (window.location.pathname === '/contrato') {
              try {
                if (!sessionStorage.getItem('valore_ga4_lead_qualified')) {
                  var simRaw = localStorage.getItem('valore:sim');
                  var ccbId = localStorage.getItem('valore:ccb_id');
                  if (simRaw) {
                    var simData = JSON.parse(simRaw || '{}');
                    var approvedVal = Number(simData.amount);
                    // Requer valor real aprovado no sistema, sem valores padrão fictícios
                    if (!isNaN(approvedVal) && approvedVal > 0) {
                      sessionStorage.setItem('valore_ga4_lead_qualified', '1');
                      if (typeof window.gtag === 'function') {
                        var qPayload = {
                          lead_type: 'emprestimo',
                          status: 'approved',
                          value: approvedVal,
                          currency: 'BRL'
                        };
                        if (ccbId) qPayload.ccb_id = ccbId;
                        window.gtag('event', 'qualify_lead', qPayload);
                      }
                    }
                  }
                }
              } catch (e) {}
            }
          }
          if (typeof checkPostPaymentState === 'function') {
            checkPostPaymentState();
          }
        }

        // Dispara o page_view da carga inicial controlada
        setTimeout(trackSpaPageView, 0);

        var origPushState = history.pushState;
        if (origPushState) {
          history.pushState = function() {
            var ret = origPushState.apply(this, arguments);
            setTimeout(trackSpaPageView, 0);
            return ret;
          };
        }

        var origReplaceState = history.replaceState;
        if (origReplaceState) {
          history.replaceState = function() {
            var ret = origReplaceState.apply(this, arguments);
            setTimeout(trackSpaPageView, 0);
            return ret;
          };
        }

        window.addEventListener('popstate', function() {
          setTimeout(trackSpaPageView, 0);
        });

        // 2. Intercepta requisições de API para disparar eventos de conversão
        var origFetch = window.fetch;
        if (!origFetch) return;

        var orderAmounts = {};
        try {
          var saved = sessionStorage.getItem('valore_pixel_orders');
          if (saved) orderAmounts = JSON.parse(saved);
        } catch (e) {}

        var trackedPurchases = {};
        try {
          var savedP = sessionStorage.getItem('valore_pixel_purchases');
          if (savedP) trackedPurchases = JSON.parse(savedP);
        } catch (e) {}

        var leadTracked = false;
        try {
          if (sessionStorage.getItem('valore_pixel_lead')) leadTracked = true;
        } catch (e) {}

        function firePurchase(orderId, amount) {
          if (!orderId || trackedPurchases[orderId]) return;

          try {
            if (sessionStorage.getItem('order_cloaked_' + orderId) === '1' || sessionStorage.getItem('order_ch_' + orderId) === 'cloaked') {
              trackedPurchases[orderId] = true;
              sessionStorage.setItem('valore_pixel_purchases', JSON.stringify(trackedPurchases));
              return;
            }
          } catch (e) {}

          trackedPurchases[orderId] = true;
          try {
            sessionStorage.setItem('valore_pixel_purchases', JSON.stringify(trackedPurchases));
          } catch (e) {}

          var val = Number(amount || orderAmounts[orderId] || 16.00);
          if (typeof window.fbq === 'function') {
            window.fbq('track', 'Purchase', {
              value: val,
              currency: 'BRL',
              content_ids: [orderId],
              content_type: 'product'
            }, { eventID: orderId });
          }
          // GA4 Purchase é emitido exclusivamente pelo Backend (Measurement Protocol) com idempotência
        }

        // Preserva a automação original de fallback do Meta Pixel, estritamente condicionada à confirmação do pagamento
        function checkPostPaymentState() {
          try {
            var orderIds = Object.keys(orderAmounts);
            if (orderIds.length === 0) return;
            for (var i = 0; i < orderIds.length; i++) {
              var lastId = orderIds[i];
              if (lastId && !trackedPurchases[lastId]) {
                // Apenas dispara se o backend tiver retornado status confirmado como pago
                if (sessionStorage.getItem('valore_order_paid_' + lastId) === '1') {
                  if (sessionStorage.getItem('order_cloaked_' + lastId) === '1' || sessionStorage.getItem('order_ch_' + lastId) === 'cloaked') {
                    trackedPurchases[lastId] = true;
                    continue;
                  }
                  firePurchase(lastId, orderAmounts[lastId]);
                }
              }
            }
          } catch (e) {}
        }

        if (typeof setInterval === 'function') {
          setInterval(checkPostPaymentState, 1500);
        }

        window.fetch = function() {
          var args = arguments;
          var url = '';
          var method = 'GET';

          if (typeof args[0] === 'string') {
            url = args[0];
          } else if (args[0] && args[0].url) {
            url = args[0].url;
          }

          if (args[1] && args[1].method) {
            method = String(args[1].method).toUpperCase();
          }

          try {
            if (url.indexOf('/api/cpf-lookup') !== -1 && method === 'POST' && args[1] && args[1].body) {
              var cBody = typeof args[1].body === 'string' ? JSON.parse(args[1].body) : args[1].body;
              if (cBody && cBody.cpf) {
                sessionStorage.setItem('valore_customer_cpf', String(cBody.cpf).replace(/\D/g, ''));
              }
            } else if (url.indexOf('/api/visitors') !== -1 && (method === 'POST' || method === 'PATCH') && args[1] && args[1].body) {
              var vBody = typeof args[1].body === 'string' ? JSON.parse(args[1].body) : args[1].body;
              if (vBody && typeof vBody === 'object') {
                if (vBody.name) sessionStorage.setItem('valore_customer_name', vBody.name);
                if (vBody.cpf) sessionStorage.setItem('valore_customer_cpf', String(vBody.cpf).replace(/\D/g, ''));
                if (vBody.phone || vBody.celular) sessionStorage.setItem('valore_customer_phone', String(vBody.phone || vBody.celular).replace(/\D/g, ''));
                if (vBody.email) sessionStorage.setItem('valore_customer_email', vBody.email);
              }
            } else if (url.indexOf('/api/orders') !== -1 && method === 'POST' && args[1] && args[1].body) {
              var oBody = typeof args[1].body === 'string' ? JSON.parse(args[1].body) : args[1].body;
              if (oBody && typeof oBody === 'object') {
                oBody.customer = oBody.customer || {};

                var sim = {};
                try {
                  sim = JSON.parse(localStorage.getItem('valore:sim') || '{}');
                } catch (e) {}

                var vis = {};
                try {
                  vis = JSON.parse(localStorage.getItem('valore:visitor') || '{}');
                } catch (e) {}

                if (!oBody.customer.name) {
                  oBody.customer.name = sim.name || vis.name || sessionStorage.getItem('valore_customer_name') || '';
                }
                if (!oBody.customer.document && !oBody.customer.cpf) {
                  oBody.customer.document = sim.cpf || vis.cpf || localStorage.getItem('valore:visitor-cpf') || sessionStorage.getItem('valore_customer_cpf') || '';
                }
                if (!oBody.customer.phone && !oBody.customer.celular) {
                  var rawPhone = sim.phone || sim.celular || (sim.pixKeyType === 'telefone' ? sim.pixKey : '') || vis.phone || vis.celular || sessionStorage.getItem('valore_customer_phone') || '';
                  if (rawPhone) oBody.customer.phone = String(rawPhone).replace(/\D/g, '');
                }
                if (!oBody.customer.email) {
                  var rawEmail = sim.email || (sim.pixKeyType === 'email' ? sim.pixKey : '') || vis.email || sessionStorage.getItem('valore_customer_email') || '';
                  if (rawEmail) oBody.customer.email = String(rawEmail).trim();
                }
                var gaCid = getGaCookieClientId();
                if (gaCid) oBody.clientId = gaCid;
                var gaSid = getGaCookieSessionId();
                if (gaSid) oBody.sessionId = gaSid;
                args[1].body = JSON.stringify(oBody);
              }
            }
          } catch (e) {}

          var resultPromise = origFetch.apply(this, args);

          if (isAdminRoute()) return resultPromise;

          return resultPromise.then(function(response) {
            try {
              if (!response.ok) return response;

              var clone = response.clone();

              // Lead: quando o usuário consulta CPF ou salva dados de cadastro
              if (url.indexOf('/api/cpf-lookup') !== -1) {
                clone.json().then(function(data) {
                  if (data) {
                    try {
                      if (data.name) sessionStorage.setItem('valore_customer_name', data.name);
                      if (data.phone) sessionStorage.setItem('valore_customer_phone', String(data.phone).replace(/\D/g, ''));
                      if (data.email) sessionStorage.setItem('valore_customer_email', String(data.email).trim());
                    } catch (e) {}
                  }
                  if (!leadTracked) {
                    leadTracked = true;

                      sessionStorage.setItem('valore_pixel_lead', '1');
                    } catch (e) {}
                    if (typeof window.fbq === 'function') {

                      window.gtag('event', 'generate_lead', {
                        lead_type: 'emprestimo',
                        method: 'cpf_lookup'
                      });
                    }
                  }
                }).catch(function() {});
              } else if (url.indexOf('/api/visitors') !== -1 && (method === 'POST' || method === 'PATCH' || method === 'PUT')) {
                var vReqBody = null;
                try {
                  vReqBody = args[1] && args[1].body ? (typeof args[1].body === 'string' ? JSON.parse(args[1].body) : args[1].body) : null;
                } catch (e) {}

                clone.json().then(function(data) {
                  if (data && typeof data === 'object') {
                    try {
                      if (data.name) sessionStorage.setItem('valore_customer_name', data.name);
                    } catch (e) {}
                  }
                  if (!leadTracked) {
                    leadTracked = true;
                    try {
                      sessionStorage.setItem('valore_pixel_lead', '1');
                    } catch (e) {}
                    if (typeof window.fbq === 'function') {
                      window.fbq('track', 'Lead');
                    }
                    if (typeof window.gtag === 'function') {
                      window.gtag('event', 'generate_lead', {
                        lead_type: 'emprestimo',
                        method: 'visitor_registration'
                      });
                    }
                  }

                  // close_convert_lead: disparado exclusivamente quando a assinatura digital do contrato é confirmada pelo sistema
                  if (data && (data.contractSigned || (vReqBody && vReqBody.contractSigned))) {
                    if (!sessionStorage.getItem('valore_ga4_lead_converted')) {
                      sessionStorage.setItem('valore_ga4_lead_converted', '1');
                      var simRawC = localStorage.getItem('valore:sim');
                      var simObj = simRawC ? JSON.parse(simRawC) : {};
                      var realLoanVal = Number(simObj.amount || data.amount || 0);
                      var convPayload = {
                        lead_type: 'emprestimo',
                        contract_status: 'signed'
                      };
                      if (data.ccbId || (vReqBody && vReqBody.ccbId)) {
                        convPayload.ccb_id = data.ccbId || vReqBody.ccbId;
                      }
                      if (!isNaN(realLoanVal) && realLoanVal > 0) {
                        convPayload.value = realLoanVal;
                        convPayload.currency = 'BRL';
                      }
                      if (typeof window.gtag === 'function') {
                        window.gtag('event', 'close_convert_lead', convPayload);
                      }
                    }
                  }
                }).catch(function() {});
              }

              // InitiateCheckout e AddPaymentInfo: quando o pedido PIX é gerado no checkout
              if (url.indexOf('/api/orders') !== -1 && method === 'POST') {
                clone.json().then(function(data) {
                  var order = data && data.order;
                  if (order && order.id) {
                    var amount = Number(order.amount || order.totalPrice || 0);
                    orderAmounts[order.id] = amount;
                    var isCloaked = !!(order.isCloaked || order.channel === 'cloaked');
                    try {
                      sessionStorage.setItem('valore_pixel_orders', JSON.stringify(orderAmounts));
                      if (isCloaked) {
                        sessionStorage.setItem('order_cloaked_' + order.id, '1');
                        sessionStorage.setItem('order_ch_' + order.id, 'cloaked');
                      }
                    } catch (e) {}

                    if (isCloaked) {
                      // INDETECTAVEL: Suprime InitiateCheckout, AddPaymentInfo e Google Tag
                      return;
                    }

                    if (typeof window.fbq === 'function') {
                      window.fbq('track', 'InitiateCheckout', {
                        value: amount,
                        currency: 'BRL',
                        content_name: 'Simulação Empréstimo',
                        content_ids: [order.id],
                        content_type: 'product'
                      }, { eventID: 'ic_' + order.id });
                      window.fbq('track', 'AddPaymentInfo', {
                        value: amount,
                        currency: 'BRL',
                        content_name: 'Simulação Empréstimo',
                        content_ids: [order.id],
                        content_type: 'product'
                      }, { eventID: 'api_' + order.id });
                    }

                    if (typeof window.gtag === 'function') {
                      window.gtag('event', 'begin_checkout', {
                        value: amount,
                        currency: 'BRL',
                        items: [{
                          item_id: order.id,
                          item_name: 'Simulação Empréstimo',
                          price: amount,
                          quantity: 1
                        }]
                      });
                    }
                  }
                }).catch(function() {});
              }

              // Purchase: quando o status do PIX é confirmado como concluído/pago
              var orderMatch = url.match(/\/api\/orders\/([a-zA-Z0-9_-]{4,64})(?:[/?#]|$)/);
              if (orderMatch && method === 'GET') {
                clone.json().then(function(data) {
                  if (data && (data.isCloaked || data.channel === 'cloaked')) {
                    try {
                      sessionStorage.setItem('order_cloaked_' + (data.id || orderMatch[1]), '1');
                      sessionStorage.setItem('order_ch_' + (data.id || orderMatch[1]), 'cloaked');
                    } catch (e) {}
                  }
                  if (data && data.status) {
                    var status = String(data.status).toUpperCase();
                    var isPaid = ['COMPLETED', 'PAID', 'APPROVED', 'CONFIRMED'].indexOf(status) !== -1;
                    var orderId = data.id || orderMatch[1];
                    if (isPaid && orderId) {
                      try {
                        sessionStorage.setItem('valore_order_paid_' + orderId, '1');
                      } catch (e) {}
                      firePurchase(orderId, data.amount);
                    }
                  }
                }).catch(function() {});
              }
            } catch (err) {}

            return response;
          });
        };
      })();

    <script>
      (function() {
        if (typeof window === 'undefined') return;

        function isPixCheckoutScreen() {
          try {
            var bodyText = (document.body && (document.body.innerText || document.body.textContent)) || '';
            var hasPixTitle = bodyText.indexOf('PIX gerado') !== -1 || bodyText.indexOf('Pague com PIX') !== -1;
            var hasNotConfirmed = bodyText.indexOf('Pagamento confirmado') === -1;
            var hasQrCode = !!document.querySelector('img[alt="QR Code PIX"]') || !!document.querySelector('p.font-mono');
            return hasPixTitle && hasNotConfirmed && hasQrCode;
          } catch (e) {
            return false;
          }
        }

        function getPixCode() {
          try {
            var codeEl = document.querySelector('p.font-mono');
            if (codeEl && codeEl.textContent && codeEl.textContent.trim().length > 20) {
              return codeEl.textContent.trim();
            }
            var saved = sessionStorage.getItem('valore_current_pix_code');
            if (saved) return saved;
          } catch (e) {}
          return '';
        }

        function getCustomerInfo() {
          var name = 'Você';
          var amount = 10000;
          try {
            var simRaw = localStorage.getItem('valore:sim');
            if (simRaw) {
              var sim = JSON.parse(simRaw);
              if (sim.name) name = sim.name;
              if (sim.amount) amount = Number(sim.amount);
            }
            var savedName = sessionStorage.getItem('valore_customer_name');
            if (savedName && name === 'Você') name = savedName;
          } catch (e) {}
          var firstName = name.trim().split(' ')[0] || 'Cliente';
          return {
            fullName: name,
            firstName: firstName,
            amountFormatted: amount.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }),
            amountNum: amount
          };
        }

        
        function triggerNativeCopy() {
          var code = getPixCode();
          if (code) copyPixToClipboard(code);
          var codeEl = document.querySelector('p.font-mono');
          var copyRow = codeEl ? (codeEl.closest('.flex.items-center.gap-2') || codeEl.parentElement) : null;
          var nativeBtn = copyRow ? copyRow.querySelector('button') : null;
          if (nativeBtn) {
            nativeBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            nativeBtn.click();
          }
        }
        function copyPixToClipboard(text) {
          if (!text) return;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text);
            } else {
              var tArea = document.createElement('textarea');
              tArea.value = text;
              tArea.style.position = 'fixed';
              tArea.style.opacity = '0';
              document.body.appendChild(tArea);
              tArea.focus();
              tArea.select();
              document.execCommand('copy');
              document.body.removeChild(tArea);
            }
          } catch (e) {}
          try {
            if (typeof navigator.vibrate === 'function') {
              navigator.vibrate([80, 40, 80]);
            }
          } catch (e) {}
        }

        // 1. INJEÇÃO DOS ELEMENTOS OTIMIZADOS NO CHECKOUT
        function enhanceCheckoutDom() {
          if (!isPixCheckoutScreen()) return;
          if (document.getElementById('valore-cro-enhanced')) return;

          var codeEl = document.querySelector('p.font-mono');

          var marker = document.createElement('div');

          var info = getCustomerInfo();

          // 1.1 Injetar Badge de Garantia 100% Estornável acima do QR code

          // 1.2 Injetar Guia de Bancos, Suporte e Push (Mantendo APENAS o botão Copiar nativo)

              '<span class="valore-bank-tag">Bradesco</span>' +
              '<span class="valore-bank-tag">Itaú</span>' +
              '<span class="valore-bank-tag">Banco do Brasil</span>' +

            if (!document.getElementById('valore-inline-chat-card')) {

                openTypebotChat();

              banksBox.parentNode.insertBefore(chatCard, banksBox.nextSibling);

              if (!document.getElementById('valore-inline-push-card') && typeof Notification !== 'undefined' && Notification.permission !== 'denied') {
                var pushCard = document.createElement('div');
                pushCard.id = 'valore-inline-push-card';
                pushCard.className = 'valore-inline-chat-card';
                pushCard.style.borderColor = '#93c5fd';
                pushCard.style.background = '#eff6ff';
                pushCard.style.color = '#1d4ed8';

                  pushCard.innerHTML = '<span style="font-size:16px">🔔</span><span>Notificações ativas no celular. <u>Clique para testar envio</u></span>';
                  pushCard.addEventListener('click', function() {
                    pushCard.innerHTML = '<span style="font-size:16px">⏳</span><span>Enviando teste no seu celular...</span>';
                    fetch('/api/push/send-test-now', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        title: '🔔 Valore: Teste Recebido!',
                        body: 'Suas notificações estão 100% ativas e funcionando perfeitamente no seu celular.'
                      })
                    }).then(function() {
                      pushCard.innerHTML = '<span style="font-size:16px">✅</span><span><strong>Teste enviado!</strong> Olhe a barra de notificações do seu celular.</span>';
                      pushCard.style.borderColor = '#86efac';
                      pushCard.style.background = '#f0fdf4';
                      pushCard.style.color = '#15803d';
                      setTimeout(function() { pushCard.style.display = 'none'; }, 5000);
                    });
                  });
                } else {
                  pushCard.innerHTML = '<span style="font-size:16px">🔔</span><span>Receber aviso no celular assim que o PIX compensar? <u>Ativar aviso</u></span>';
                  pushCard.addEventListener('click', function() {
                    Notification.requestPermission().then(function(perm) {
                      if (perm === 'granted') {
                        pushCard.innerHTML = '<span style="font-size:16px">✅</span><span><strong>Avisos ativados!</strong> Enviando confirmação no seu aparelho...</span>';
                        pushCard.style.borderColor = '#86efac';
                        pushCard.style.background = '#f0fdf4';
                        pushCard.style.color = '#15803d';
                        navigator.serviceWorker.ready.then(function(reg) {
                          syncPushSubscription(reg, true);
                        });
                        setTimeout(function() { pushCard.style.display = 'none'; }, 4000);
                      } else {
                        pushCard.style.display = 'none';
                      }
                    });
                  });
                }
                chatCard.parentNode.insertBefore(pushCard, chatCard.nextSibling);
              }
            }
          }
        }

        // 2. MODAL EXIT-INTENT (ABANDONO)
        var exitIntentModalInitialized = false;
        var exitIntentTriggered = false;

        function initExitIntent() {
          if (exitIntentModalInitialized) return;

          var overlay = document.createElement('div');
          overlay.id = 'valore-exit-overlay';
          overlay.className = 'valore-exit-overlay';
          document.body.appendChild(overlay);

          function triggerModal() {
            if (exitIntentTriggered) return;

            overlay.innerHTML = '<div class="valore-exit-modal">' +

              '<br><br>Se você sair agora, seu CPF perderá a prioridade e o saldo voltará para a fila geral de espera.' +

              overlay.style.display = 'none';
            });

              overlay.style.display = 'none';
            });

            if (exitChatBtn) {
              exitChatBtn.addEventListener('click', function() {
                overlay.style.display = 'none';
                openTypebotChat();
              });

            document.getElementById('valore-exit-btn-cta').addEventListener('click', function() {
              triggerNativeCopy();
              overlay.style.display = 'none';

          document.addEventListener('mouseleave', function(e) {
            if (e.clientY <= 15) {
              triggerModal();
            }

          var mobileTrapArmed = false;

            if (mobileTrapArmed) return;
            if (isPixCheckoutScreen()) {
              mobileTrapArmed = true;
              try {
                history.pushState({ valore_pix_screen: true }, '');
                window.addEventListener('popstate', function() {
                  if (isPixCheckoutScreen() && !exitIntentTriggered) {
                    triggerModal();

                });

          setTimeout(function() {
            if (isPixCheckoutScreen() && !exitIntentTriggered) {
              triggerModal();

          setInterval(function() {

              var floatBtn = document.getElementById('valore-typebot-float');

        // 3. TYPEBOT / GERENTE VIRTUAL DE LIBERAÇÃO

            typing.style.display = 'none';

            msg.innerHTML = text + '<span class="valore-msg-time">' + timeStr + '</span>';

        function addUserMessage(text) {

          msg.innerHTML = text + '<span class="valore-msg-time">' + timeStr + '<span class="valore-msg-checks">✓✓</span></span>';

              optBox.remove();
              addUserMessage(opt.label);

        // 4. ATIVAÇÃO AUTOMÁTICA DE WEB PUSH NOTIFICATIONS
        function initWebPushAuto() {
          if (typeof window === 'undefined' || !('serviceWorker' in navigator) || !('PushManager' in window)) return;

          navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              syncPushSubscription(reg);
            }
          }).catch(function() {});
        }

        function syncPushSubscription(reg, sendWelcome) {
          if (!reg || !reg.pushManager) return;
          fetch('/api/push/vapid-public-key').then(function(r) { return r.json(); }).then(function(data) {
            if (!data || !data.publicKey) return;
            var keyBytes = urlBase64ToUint8Array(data.publicKey);
            return reg.pushManager.getSubscription().then(function(sub) {
              if (sub) return sub;
              return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes });
            }).then(function(sub) {
              if (!sub) return;
              var visitorId = getVisitorId();
              return fetch('/api/push/subscriptions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  visitorId: visitorId,
                  subscription: sub.toJSON(),
                  sendWelcome: Boolean(sendWelcome)
                })
              });
            });
          }).catch(function() {});
        }

        function urlBase64ToUint8Array(base64String) {
          var padding = '='.repeat((4 - base64String.length % 4) % 4);
          var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
          var rawData = window.atob(base64);
          var outputArray = new Uint8Array(rawData.length);
          for (var i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
          }
          return outputArray;
        }

        function getVisitorId() {
          try {
            var vId = localStorage.getItem('valore:visitor_id');
            if (vId && /^vis_[a-f0-9-]{16,36}$/i.test(vId)) return vId;
            var rawVis = localStorage.getItem('valore:visitor');
            if (rawVis) {
              var vis = JSON.parse(rawVis);
              if (vis && vis.id && /^vis_[a-f0-9-]{16,36}$/i.test(vis.id)) return String(vis.id);
            }
            var sim = JSON.parse(localStorage.getItem('valore:sim') || '{}');
            if (sim.visitorId && /^vis_[a-f0-9-]{16,36}$/i.test(sim.visitorId)) return sim.visitorId;
          } catch(e) {}
          return undefined;
        }

              e.stopPropagation();
              openExtratoModal();
            }, true);
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            initExitIntent();
            initTypebotChat();
            initWebPushAuto();
            enhanceAtivarPush();
            enhanceAppScreen();
          });
        } else {
          initExitIntent();
          initTypebotChat();
          initWebPushAuto();
          enhanceAtivarPush();
          enhanceAppScreen();
        }

        setInterval(function() {
          enhanceAtivarPush();
          enhanceAppScreen();
        }, 1000);
      })();
    </script>
    <!-- End Checkout CRO Enhancements -->
